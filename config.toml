  siteName = "METAL3DPRINT"
logoHtml = 'METAL<span class="ed-logo-accent">3D</span>PRINT'
  tagline = "The authoritative source for metal additive manufacturing news"

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "JSON"]
